syntax = "proto3";

package platform.v1;

import "google/protobuf/timestamp.proto";

// The only server stream in the API. Resumable: pass the last offset you
// saw as after_offset after any disconnect.
service EventService {
  // Replays events with offset > after_offset, then follows new ones until
  // the client cancels. Heartbeats (offset 0) are sent while idle.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

message WatchEventsRequest {
  string conversation_id = 1;
  int64 after_offset = 2;
}

message WatchEventsResponse {
  Event event = 1;
}

// Platform envelope (version 1). Clients never see agent SDK message shapes.
message Event {
  // Strictly increasing per conversation, starting at 1. 0 for heartbeats.
  int64 offset = 1;
  string conversation_id = 2;
  string run_id = 3;
  google.protobuf.Timestamp time = 4;
  // Set when the event comes from a subagent: nest it under that tool call.
  string parent_tool_use_id = 5;

  oneof body {
    UserMessage user_message = 10;
    RunStatusChanged run_status = 11;
    TextDelta text_delta = 12;
    AssistantText assistant_text = 13;
    Thinking thinking = 14;
    ToolCall tool_call = 15;
    ToolResult tool_result = 16;
    Subagent subagent = 17;
    RunResult result = 18;
    Notice notice = 19;
    Heartbeat heartbeat = 20;
  }
}

message UserMessage {
  string text = 1;
}

message RunStatusChanged {
  // Lowercase status name: queued, running, succeeded, failed, cancelled,
  // interrupted.
  string status = 1;
  string error = 2;
}

// Streamed tokens. Superseded by the AssistantText with the same
// message_id and index.
message TextDelta {
  string message_id = 1;
  int32 index = 2;
  string text = 3;
}

message AssistantText {
  string message_id = 1;
  int32 index = 2;
  string text = 3;
}

message Thinking {
  string message_id = 1;
  int32 index = 2;
  string text = 3;
}

message ToolCall {
  string tool_use_id = 1;
  string name = 2;
  // Tool input as JSON (may be truncated).
  string input_json = 3;
}

message ToolResult {
  string tool_use_id = 1;
  // Text content (may be truncated).
  string content = 2;
  bool is_error = 3;
}

// A subagent task started or finished inside the run.
message Subagent {
  string task_id = 1;
  // The parent's Task/Agent tool call that started it.
  string tool_use_id = 2;
  string description = 3;
  // started, completed, failed or stopped.
  string status = 4;
  string summary = 5;
}

// End-of-turn summary from the agent runtime.
message RunResult {
  bool is_error = 1;
  string text = 2;
  int32 num_turns = 3;
  double cost_usd = 4;
  int64 duration_ms = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
  string stop_reason = 8;
}

message Notice {
  // info, warning or error.
  string level = 1;
  string message = 2;
}

message Heartbeat {}
