syntax = "proto3";

package platform.v1;

// A problem found while validating an agent file. Validation never blocks a
// save; an agent with error diagnostics is blocked from running instead.
message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_ERROR = 1;
    SEVERITY_WARNING = 2;
  }
  // Path relative to the agent root, e.g. "agent.json".
  string path = 1;
  Severity severity = 2;
  string message = 3;
  // JSON pointer-like location inside the file, when known (e.g. "/approvals/mode").
  string location = 4;
}
