syntax = "proto3";

package platform.v1;

import "google/protobuf/timestamp.proto";
import "platform/v1/common.proto";

service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  // Soft delete: the folder moves to the trash and the agent leaves the index.
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  rpc ValidateAgent(ValidateAgentRequest) returns (ValidateAgentResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
}

message Agent {
  // Folder name and stable id: lowercase letters, digits and dashes.
  string slug = 1;
  string name = 2;
  string description = 3;
  // Template the agent was created from.
  string template = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Template {
  string name = 1;
  string description = 2;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message GetAgentRequest {
  string slug = 1;
}

message GetAgentResponse {
  Agent agent = 1;
  // Raw agent.json content, so clients show exactly what is on disk.
  string manifest_json = 2;
  repeated Diagnostic diagnostics = 3;
}

message CreateAgentRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  // Defaults to "blank".
  string template = 4;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string slug = 1;
}

message DeleteAgentResponse {}

message ValidateAgentRequest {
  string slug = 1;
}

message ValidateAgentResponse {
  repeated Diagnostic diagnostics = 1;
  // False when any diagnostic is an error; runs are blocked until fixed.
  bool runnable = 2;
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated Template templates = 1;
}
