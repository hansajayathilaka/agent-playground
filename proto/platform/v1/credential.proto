syntax = "proto3";

package platform.v1;

import "google/protobuf/timestamp.proto";

// Named, encrypted model credentials. Secrets are write-only: no response
// ever contains one.
service CredentialService {
  rpc ListCredentialSets(ListCredentialSetsRequest) returns (ListCredentialSetsResponse);
  rpc CreateCredentialSet(CreateCredentialSetRequest) returns (CreateCredentialSetResponse);
  rpc UpdateCredentialSet(UpdateCredentialSetRequest) returns (UpdateCredentialSetResponse);
  // Fails with FAILED_PRECONDITION while an agent's agent.json names the set,
  // or when it is the default and other sets exist.
  rpc DeleteCredentialSet(DeleteCredentialSetRequest) returns (DeleteCredentialSetResponse);
  rpc MakeDefault(MakeDefaultRequest) returns (MakeDefaultResponse);
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_ANTHROPIC = 1;
  // Any Anthropic-compatible base URL (for example DeepSeek).
  PROVIDER_GATEWAY = 2;
  PROVIDER_LITELLM = 3;
  PROVIDER_BEDROCK = 4;
  PROVIDER_VERTEX = 5;
}

enum AuthType {
  AUTH_TYPE_UNSPECIFIED = 0;
  // Sent as ANTHROPIC_API_KEY.
  AUTH_TYPE_API_KEY = 1;
  // Sent as ANTHROPIC_AUTH_TOKEN (Authorization: Bearer).
  AUTH_TYPE_BEARER = 2;
}

message CredentialSet {
  string id = 1;
  // Agents refer to a set by name in agent.json ("credential_set").
  string name = 2;
  string description = 3;
  Provider provider = 4;
  string base_url = 5;
  AuthType auth_type = 6;
  map<string, string> headers = 7;
  string default_model = 8;
  repeated string allowed_models = 9;
  bool is_default = 10;
  bool has_secret = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CredentialSetInput {
  string name = 1;
  string description = 2;
  Provider provider = 3;
  string base_url = 4;
  AuthType auth_type = 5;
  map<string, string> headers = 6;
  string default_model = 7;
  repeated string allowed_models = 8;
}

message ListCredentialSetsRequest {}

message ListCredentialSetsResponse {
  repeated CredentialSet credential_sets = 1;
}

message CreateCredentialSetRequest {
  CredentialSetInput input = 1;
  string secret = 2;
  // The first set is always the default.
  bool make_default = 3;
}

message CreateCredentialSetResponse {
  CredentialSet credential_set = 1;
}

message UpdateCredentialSetRequest {
  string id = 1;
  CredentialSetInput input = 2;
  // Replace the secret only when set.
  optional string secret = 3;
}

message UpdateCredentialSetResponse {
  CredentialSet credential_set = 1;
}

message DeleteCredentialSetRequest {
  string id = 1;
}

message DeleteCredentialSetResponse {}

message MakeDefaultRequest {
  string id = 1;
}

message MakeDefaultResponse {}
