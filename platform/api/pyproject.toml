[project]
name = "playground-api"
version = "0.1.0"
description = "grpc.aio API server and composition root."
requires-python = ">=3.12"
dependencies = [
  "playground-core",
  "playground-adapters",
  "playground-proto",
  "grpcio>=1.70",
  "grpcio-reflection>=1.70",
  "grpcio-health-checking>=1.70",
  "pydantic-settings>=2.7",
]

[project.scripts]
playground-api = "playground_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground_api"]
