[project]
name = "playground-worker"
version = "0.1.0"
description = "Background worker: claims queued runs and executes them with the Claude Agent SDK."
requires-python = ">=3.12"
dependencies = [
  "playground-core",
  "playground-adapters",
  "claude-agent-sdk>=0.2.179",
]

[project.scripts]
playground-worker = "playground_worker.main:run"
# cli_path for the SDK: re-execs the bundled Claude CLI with only the run's env.
playground-claude-launcher = "playground_worker.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground_worker"]
