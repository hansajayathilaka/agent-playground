[project]
name = "playground-adapters"
version = "0.1.0"
description = "Concrete implementations of playground-core ports."
requires-python = ">=3.12"
dependencies = [
  "playground-core",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground_adapters"]
