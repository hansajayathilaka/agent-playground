[project]
name = "playground-core"
version = "0.1.0"
description = "Domain models, ports and pure services. Imports no concrete technology."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground_core"]
