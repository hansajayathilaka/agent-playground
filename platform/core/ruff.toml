# Core may import only the standard library, pydantic and itself.
extend = "../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"playground_adapters".msg = "core imports ports only; adapters are wired in the composition root"
"playground_api".msg = "core must not depend on the API layer"
"playground_proto".msg = "core must not depend on generated protobuf code"
"grpc".msg = "no concrete technology in core"
"psycopg".msg = "no concrete technology in core"
"psycopg_pool".msg = "no concrete technology in core"
"redis".msg = "no concrete technology in core"
