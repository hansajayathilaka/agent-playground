[project]
name = "playground-proto"
version = "0.1.0"
description = "Generated Python code for proto/platform/v1 (do not edit by hand)."
requires-python = ">=3.12"
dependencies = ["grpcio>=1.70", "protobuf>=5.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground_proto"]
