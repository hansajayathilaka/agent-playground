name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Python tests (end-to-end against a fake model API)
        run: python -m unittest discover -s tests -v
      - name: Validate plugins and marketplace
        run: |
          claude plugin validate .
          claude plugin validate plugins/playground
          claude plugin validate plugins/playground-hud
      - name: Mod tests
        run: claude plugin test plugins/playground-hud
      - name: Agent folders pass pg check
        run: |
          for d in agents/*/; do python plugins/playground/scripts/pg.py check "$(basename "$d")"; done
